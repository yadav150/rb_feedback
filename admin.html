<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta
    name="description"
    content="Rudra Bhakti Admin Panel"
/>


<title>
    Rudra Bhakti — Admin Panel
</title>


<link
    rel="stylesheet"
    href="admin.css"
/>


</head>


<body>


<main class="admin-app" id="admin-app">



<!-- =================================
     LOGIN SECTION
================================== -->


<section
    class="admin-login"
    id="admin-login"
>


<div class="admin-card">


<div class="admin-brand">

<h1>
    Rudra Bhakti
</h1>

<span>
    Admin Panel
</span>

</div>



<form
    id="login-form"
    class="admin-form"
>



<div class="field-group">


<label for="admin-email">
    Email
</label>


<input
    type="email"
    id="admin-email"
    placeholder="Enter admin email"
    autocomplete="email"
    required
>


</div>




<div class="field-group">


<label for="admin-password">
    Password
</label>


<input
    type="password"
    id="admin-password"
    placeholder="Enter password"
    autocomplete="current-password"
    required
>


</div>



<div
    class="login-error"
    id="login-error"
    hidden
></div>




<button
    type="submit"
    class="primary-button"
    id="login-button"
>

<span>
    Login
</span>

</button>



</form>


</div>


</section>





<!-- =================================
     DASHBOARD
================================== -->


<section
    class="admin-dashboard"
    id="admin-dashboard"
    hidden
>





<header class="dashboard-header">


<div>


<h1>
    Rudra Bhakti Admin
</h1>


<p>
    Manage reels and feedback analytics
</p>


</div>




<button
    type="button"
    class="logout-button"
    id="logout-button"
>

Logout

</button>


</header>







<!-- =================================
     NAVIGATION
================================== -->


<nav class="admin-nav">


<button
    class="nav-button active"
    data-section="dashboard-section"
>

Dashboard

</button>



<button
    class="nav-button"
    data-section="add-section"
>

Add Reel

</button>




<button
    class="nav-button"
    data-section="analytics-section"
>

Analytics

</button>



</nav>








<!-- =================================
     DASHBOARD SECTION
================================== -->


<section
    class="admin-section active"
    id="dashboard-section"
>


<div class="stats-grid">


<div class="stat-card">


<span>
    Total Reels
</span>


<strong id="total-reels">
    0
</strong>


</div>





<div class="stat-card">


<span>
    Total Responses
</span>


<strong id="total-responses">
    0
</strong>


</div>





<div class="stat-card">


<span>
    Average Rating
</span>


<strong id="average-rating">
    0
</strong>


</div>


</div>


</section>







<!-- =================================
     ADD REEL SECTION
================================== -->


<section
    class="admin-section"
    id="add-section"
    hidden
>


<div class="admin-card">


<h2>
    Add New Reel
</h2>



<form
    id="add-reel-form"
    class="admin-form"
>



<div class="field-group">


<label>
    Reel ID
</label>


<input
    type="text"
    id="reel-id"
    placeholder="Example: RB001"
>


</div>





<div class="field-group">


<label>
    Reel Title
</label>


<input
    type="text"
    id="reel-title-input"
    placeholder="Enter reel title"
>


</div>





<div class="field-group">


<label>
    Facebook Reel URL
</label>


<input
    type="url"
    id="reel-url"
    placeholder="Paste Facebook reel link"
>


</div>





<div class="field-group">


<label>
    Thumbnail URL
</label>


<input
    type="url"
    id="reel-thumbnail-input"
    placeholder="Paste thumbnail URL"
>


</div>




<button
    type="submit"
    class="primary-button"
>

Add Reel

</button>



</form>


</div>


</section>








<!-- =================================
     ANALYTICS SECTION
================================== -->


<section
    class="admin-section"
    id="analytics-section"
    hidden
>


<div class="admin-card">


<h2>
    Analytics
</h2>


<p>
    Detailed feedback analysis will appear here.
</p>


</div>


</section>






</section>


</main>





<script
    type="module"
    src="admin.js"
></script>



</body>

</html>
